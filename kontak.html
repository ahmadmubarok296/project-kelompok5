<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <section class="form-kontak">
        <h2>Kirim Pesan</h2>
        <label for="nama">Nama</label>

        <textarea id="pesan" rows="4"></textarea>
        <button type="button" id="tombol-kirim">Kirim</button>
        <p id="status-form"></p>
    </section>
</body>
</html>
